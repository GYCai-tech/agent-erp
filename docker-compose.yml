version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente-erp-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENVIRONMENT=development
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - agente-erp-network

  # Streamlit UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente-erp-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./ui:/app/ui
    command: streamlit run ui/Home.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - agente-erp-network

  # Qdrant (para futuro - almacenamiento de embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agente-erp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - agente-erp-network

networks:
  agente-erp-network:
    driver: bridge

volumes:
  qdrant_data:
